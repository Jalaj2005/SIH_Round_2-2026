services:
  redis:
    image: redis:7-alpine
  recon-detector:
    build: .
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      WINDOW_SECONDS: "5"
      HORIZ_THRESHOLD: "20"
      VERT_THRESHOLD: "20"
      # DASHBOARD_WEBHOOK: http://soc-dashboard:3000/api/alerts
    depends_on: [redis]
